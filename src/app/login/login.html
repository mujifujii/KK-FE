<div class="login">
  <div class="card">
    <h1>🌿 KrautKontroll</h1>
    <p class="sub">Bitte anmelden</p>

    <input
      type="password"
      [value]="password()"
      (input)="password.set($any($event.target).value)"
      (keyup.enter)="submit()"
      placeholder="Passwort"
    />
    <button (click)="submit()">Einloggen</button>

    @if (error()) {
      <p class="err">Falsches Passwort.</p>
    }

    <p class="hint">Passwörter: <code>orchestrator1</code> · <code>client&lt;N&gt;</code> (z.B. client5) · <code>chaperone&lt;N&gt;</code> (z.B. chaperone2)</p>
  </div>
</div>
