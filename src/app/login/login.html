<div class="login">
  <div class="card">
    <h1>🌿 KrautKontroll</h1>
    <p class="sub">Bitte anmelden</p>

    <input
      type="password"
      [value]="password()"
      (input)="password.set($any($event.target).value)"
      (keyup.enter)="submit()"
      placeholder="Passwort"
    />
    <button (click)="submit()">Einloggen</button>

    @if (error()) {
      <p class="err">Falsches Passwort.</p>
    }

    <p class="hint">Demo-Passwörter: <code>orchestrator1</code> · <code>client1</code> · <code>chaperone1</code></p>
  </div>
</div>
